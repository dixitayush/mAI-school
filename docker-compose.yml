name: maischool

# Public traffic never reaches this stack. Traefik on the `proxy` network is
# the only process with host ports. Caddy joins `proxy`; client, server, and
# Postgres stay on `maischool` only.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maischool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mai_school}
    volumes:
      - maischool_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maischool} -d ${POSTGRES_DB:-mai_school}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - maischool

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      TRUST_PROXY: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-maischool}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mai_school}
      DATABASE_POOL_URL: ""
      JWT_SECRET: ${JWT_SECRET}
      MAI_GRAPHQL_DB_PASSWORD: ${MAI_GRAPHQL_DB_PASSWORD}
      ROOT_DOMAIN: ${MAISCHOOL_HOST:-maischool.ayushdixit.work}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://maischool.ayushdixit.work}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://maischool.ayushdixit.work}
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://maischool.ayushdixit.work}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    volumes:
      - maischool_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - maischool

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://maischool.ayushdixit.work}
        NEXT_PUBLIC_ROOT_DOMAIN: ${MAISCHOOL_HOST:-maischool.ayushdixit.work}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_API_URL:-https://maischool.ayushdixit.work}
        NEXT_PUBLIC_API_SAME_ORIGIN: "1"
        NEXT_PUBLIC_TENANT_LOGIN_PATH: "1"
        INTERNAL_API_URL: http://server:5000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      INTERNAL_API_URL: http://server:5000
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - maischool

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - maischool
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.maischool.rule=Host(`${MAISCHOOL_HOST:-maischool.ayushdixit.work}`)
      - traefik.http.routers.maischool.entrypoints=websecure
      - traefik.http.routers.maischool.tls=true
      - traefik.http.routers.maischool.tls.certresolver=le
      - traefik.http.routers.maischool.middlewares=https-fwd@file,secure-headers@file
      - traefik.http.services.maischool.loadbalancer.server.port=80
      - traefik.http.services.maischool.loadbalancer.passhostheader=true

networks:
  maischool:
    name: maischool_internal
    driver: bridge
  proxy:
    external: true
    name: proxy

volumes:
  maischool_pg:
  maischool_uploads:
