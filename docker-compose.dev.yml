# Local laptop only: Postgres on host port 5433 (Chaibook-style).
# App processes still run with npm (client :3000, server :5001).
# VPS production is docker-compose.yml (no published ports).

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maischool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maischool}
      POSTGRES_DB: ${POSTGRES_DB:-mai_school}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maischool} -d ${POSTGRES_DB:-mai_school}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
